<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Change Password</title>
  <style>
    body { font-family: 'Segoe UI', Arial; background: #f4f6f9; margin: 0; }
    .navbar { background: #1a73e8; color: white; padding: 15px 30px; }
    .box { max-width: 420px; margin: 60px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #ddd; }
    button { background: #1a73e8; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <div class="navbar"><h1>Change Password</h1></div>
  <div class="box">
    <input id="current" type="password" placeholder="Current Password">
    <input id="newpass" type="password" placeholder="New Password">
    <input id="confirm" type="password" placeholder="Confirm New Password">
    <button onclick="changePassword()">Change Password</button>
    <p id="msg" style="margin-top:15px;"></p>
    <p style="margin-top:20px;"><a href="/">← Back to Home</a></p>
  </div>
  <script>
    const token = localStorage.getItem("token") || localStorage.getItem("teacher_token") || localStorage.getItem("admin_token") || "";
    async function changePassword() {
      const current = document.getElementById("current").value;
      const newpass = document.getElementById("newpass").value;
      const confirm = document.getElementById("confirm").value;
      if (newpass !== confirm) {
        document.getElementById("msg").textContent = "New passwords do not match";
        document.getElementById("msg").style.color = "red";
        return;
      }
      const res = await fetch(`/change-password?current_password=${encodeURIComponent(current)}&new_password=${encodeURIComponent(newpass)}`, {
        method: "POST",
        headers: {Authorization: "Bearer " + token}
      });
      const data = await res.json();
      document.getElementById("msg").textContent = res.ok ? "Password changed!" : (data.detail || "Failed");
      document.getElementById("msg").style.color = res.ok ? "green" : "red";
    }
  </script>
</body>
</html>
