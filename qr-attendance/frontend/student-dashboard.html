<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial; background: #f4f6f9; }
    .navbar { background: #0d47a1; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
    .container { max-width: 800px; margin: 15px auto; padding: 0 12px; }
    .card { background: white; border-radius: 12px; padding: 18px; margin-bottom: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 6px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #f8f9fa; }
    .hidden { display: none; }
    @media (max-width: 600px) {
      .navbar { flex-direction: column; gap: 8px; text-align: center; }
      table, th, td { font-size: 14px; }
      .container { padding: 0 8px; }
    }
  </style>
</head>
<body>
  <div class="navbar">
    <h1>Student Dashboard</h1>
    <button onclick="logout()" style="padding:8px 16px; background:#fff; color:#0d47a1; border:none; border-radius:6px;">Logout</button>
  </div>
  <div class="container">
    <div class="card">
      <h2>My Courses & Attendance</h2>
      <table>
        <thead>
          <tr>
            <th>Course</th>
            <th>Attendance</th>
            <th>%</th>
          </tr>
        </thead>
        <tbody id="courses"></tbody>
      </table>
    </div>
  </div>
  <script>
    const token = localStorage.getItem("student_token");
    if (!token) location.href = "/student";

    function logout() {
      localStorage.removeItem("student_token");
      location.href = "/student";
    }

    async function load() {
      const res = await fetch("/me/dashboard", {
        headers: {Authorization: "Bearer " + token}
      });
      const data = await res.json();
      const tbody = document.getElementById("courses");
      tbody.innerHTML = "";
      data.courses.forEach(c => {
        tbody.innerHTML += `
          <tr>
            <td>${c.code} - ${c.title}</td>
            <td>${c.attended}/${c.total_sessions}</td>
            <td><b>${c.percentage}%</b></td>
          </tr>`;
      });
    }
    load();
  </script>
</body>
</html>
